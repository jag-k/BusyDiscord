services:
  busydiscord:
    image: ghcr.io/jag-k/busydiscord:${BUSYDISCORD_VERSION:-latest}
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.state:/app/.state
    stop_signal: SIGINT
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
