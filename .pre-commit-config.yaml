repos:
  - repo: local
    hooks:
      - id: ssort
        name: Sort Python statements
        entry: uv run --locked ssort
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ty
        name: Check Python types
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: unit-tests
        name: Run unit tests
        entry: uv run --locked python -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        files: '(\.py$|\.anim$|^pyproject\.toml$|^uv\.lock$)'
